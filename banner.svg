<svg width="100%" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.35" />
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="wave2Grad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glowing Accent -->
    <radialGradient id="glowSpot" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatWave {
      0% { transform: translateX(0); }
      50% { transform: translateX(-30px); }
      100% { transform: translateX(0); }
    }
    .wave-anim {
      animation: floatWave 8s ease-in-out infinite;
    }
    .banner-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .banner-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 20px;
      fill: #06b6d4;
      letter-spacing: 0.5px;
    }
    .banner-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      fill: #94a3b8;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="220" rx="12" fill="url(#bgGrad)" />
  <rect width="1200" height="220" rx="12" fill="url(#glowSpot)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#06b6d4" stroke-width="1">
    <line x1="0" y1="44" x2="1200" y2="44" />
    <line x1="0" y1="88" x2="1200" y2="88" />
    <line x1="0" y1="132" x2="1200" y2="132" />
    <line x1="0" y1="176" x2="1200" y2="176" />
    <line x1="200" y1="0" x2="200" y2="220" />
    <line x1="400" y1="0" x2="400" y2="220" />
    <line x1="600" y1="0" x2="600" y2="220" />
    <line x1="800" y1="0" x2="800" y2="220" />
    <line x1="1000" y1="0" x2="1000" y2="220" />
  </g>

  <!-- Waving Waves Layer 1 -->
  <path class="wave-anim" d="M0,170 C240,130 480,210 720,165 C960,120 1080,185 1200,160 L1200,220 L0,220 Z" fill="url(#wave1Grad)" />

  <!-- Waving Waves Layer 2 -->
  <path d="M0,185 C200,160 440,215 680,175 C920,135 1100,195 1200,180 L1200,220 L0,220 Z" fill="url(#wave2Grad)" />

  <!-- Center Decorative Glow -->
  <circle cx="600" cy="85" r="90" fill="#06b6d4" opacity="0.12" filter="url(#glowFilter)" />

  <!-- Text Header -->
  <g text-anchor="middle">
    <!-- Top badge -->
    <text x="600" y="55" class="banner-badge">⚡ 10+ YEARS • TECHNICAL LEAD &amp; SYSTEMS ARCHITECT</text>

    <!-- Main Name -->
    <text x="600" y="112" class="banner-title">Savan Karathiya</text>

    <!-- Subtitle -->
    <text x="600" y="152" class="banner-sub">High-Throughput Microservices (50k QPS) • Distributed Systems</text>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="219" rx="11.5" stroke="rgba(6, 182, 212, 0.25)" fill="none" />
</svg>
